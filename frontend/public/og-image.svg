<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" fill="none">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="630" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#13131a"/>
      <stop offset="100%" stop-color="#0a0a10"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f0d482"/>
      <stop offset="50%" stop-color="#d4a85a"/>
      <stop offset="100%" stop-color="#a8732a"/>
    </linearGradient>
    <linearGradient id="jade" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#7edbc4"/>
      <stop offset="100%" stop-color="#38b09a"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- Subtle grid lines -->
  <line x1="0" y1="210" x2="1200" y2="210" stroke="#ffffff" stroke-opacity="0.03" stroke-width="1"/>
  <line x1="0" y1="420" x2="1200" y2="420" stroke="#ffffff" stroke-opacity="0.03" stroke-width="1"/>
  <line x1="400" y1="0" x2="400" y2="630" stroke="#ffffff" stroke-opacity="0.03" stroke-width="1"/>
  <line x1="800" y1="0" x2="800" y2="630" stroke="#ffffff" stroke-opacity="0.03" stroke-width="1"/>

  <!-- Left gold accent bar -->
  <rect x="0" y="0" width="4" height="630" fill="url(#gold)"/>

  <!-- J logo mark -->
  <rect x="80" y="180" width="52" height="8" rx="4" fill="url(#gold)"/>
  <rect x="104" y="180" width="18" height="108" rx="4" fill="url(#gold)"/>
  <path d="M 122 282 Q 122 330 84 330 Q 64 330 64 314 L 64 308 Q 64 298 72 298 L 80 298 Q 88 298 88 308 L 88 312 Q 88 320 84 320 Q 98 320 108 308 Q 118 298 118 283 Z" fill="url(#gold)"/>

  <!-- Brand name -->
  <text x="160" y="250" font-family="Georgia, serif" font-size="72" font-weight="700" fill="white" letter-spacing="-1">Janze</text>
  <text x="160" y="286" font-family="Georgia, serif" font-size="22" fill="#d4a85a" letter-spacing="8">ERP</text>

  <!-- Divider -->
  <rect x="80" y="360" width="520" height="1" fill="#d4a85a" fill-opacity="0.3"/>

  <!-- Tagline -->
  <text x="80" y="400" font-family="system-ui, sans-serif" font-size="26" fill="#ffffff" fill-opacity="0.7">Fashion Retail Management System</text>
  <text x="80" y="435" font-family="system-ui, sans-serif" font-size="18" fill="#ffffff" fill-opacity="0.4">Inventory · Sales · Analytics · Finance</text>

  <!-- Right side — decorative stats cards -->
  <rect x="740" y="120" width="200" height="110" rx="14" fill="#1e1e28" stroke="#d4a85a" stroke-width="1" stroke-opacity="0.25"/>
  <text x="765" y="160" font-family="system-ui, sans-serif" font-size="13" fill="#d4a85a" fill-opacity="0.8">DAROMAD</text>
  <text x="765" y="198" font-family="Georgia, serif" font-size="32" font-weight="700" fill="white">↑ 24%</text>

  <rect x="960" y="120" width="200" height="110" rx="14" fill="#1e1e28" stroke="#56c4a8" stroke-width="1" stroke-opacity="0.25"/>
  <text x="985" y="160" font-family="system-ui, sans-serif" font-size="13" fill="#56c4a8" fill-opacity="0.8">FOYDA</text>
  <text x="985" y="198" font-family="Georgia, serif" font-size="32" font-weight="700" fill="white">↑ 18%</text>

  <rect x="740" y="252" width="200" height="110" rx="14" fill="#1e1e28" stroke="#ffffff" stroke-width="1" stroke-opacity="0.08"/>
  <text x="765" y="292" font-family="system-ui, sans-serif" font-size="13" fill="#ffffff" fill-opacity="0.4">MAHSULOTLAR</text>
  <text x="765" y="330" font-family="Georgia, serif" font-size="32" font-weight="700" fill="white">2,840</text>

  <rect x="960" y="252" width="200" height="110" rx="14" fill="#1e1e28" stroke="#ffffff" stroke-width="1" stroke-opacity="0.08"/>
  <text x="985" y="292" font-family="system-ui, sans-serif" font-size="13" fill="#ffffff" fill-opacity="0.4">BUYURTMALAR</text>
  <text x="985" y="330" font-family="Georgia, serif" font-size="32" font-weight="700" fill="white">14.2K</text>

  <!-- Bottom bar -->
  <rect x="0" y="590" width="1200" height="40" fill="#0a0a10"/>
  <text x="80" y="614" font-family="system-ui, sans-serif" font-size="14" fill="#ffffff" fill-opacity="0.3">janze-erp-frontend.vercel.app</text>
  <rect x="1160" y="590" width="40" height="40" fill="#d4a85a" fill-opacity="0.15"/>
