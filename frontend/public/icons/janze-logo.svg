<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1a1a1f"/>
      <stop offset="100%" stop-color="#0f0f12"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#e8c97a"/>
      <stop offset="50%" stop-color="#d4a85a"/>
      <stop offset="100%" stop-color="#b8872a"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <!-- Background -->
  <rect width="512" height="512" rx="96" fill="url(#bg)"/>
  <!-- Thin border -->
  <rect width="512" height="512" rx="96" fill="none" stroke="#d4a85a" stroke-width="1.5" stroke-opacity="0.3"/>
  <!-- Letter J — luxury serif style -->
  <!-- Main vertical stroke -->
  <rect x="260" y="128" width="28" height="220" rx="4" fill="url(#gold)"/>
  <!-- J bottom curve — left arc -->
  <path d="M 288 332 Q 288 420 200 420 Q 148 420 148 374 L 148 358 Q 148 344 162 344 L 176 344 Q 190 344 190 358 L 190 368 Q 190 384 200 384 Q 228 384 246 368 Q 260 354 260 332 Z" fill="url(#gold)"/>
  <!-- Top serif left -->
  <rect x="224" y="128" width="100" height="22" rx="4" fill="url(#gold)"/>
  <!-- Subtle diamond accent below J -->
  <path d="M 256 445 L 264 458 L 256 471 L 248 458 Z" fill="#d4a85a" fill-opacity="0.6"/>
</svg>
