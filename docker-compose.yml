version: '3.9'

volumes:
  pgdata:
  redis_data:

networks:
  erp_net:
    driver: bridge

services:

  db:
    image: postgres:16-alpine
    container_name: avero_db
    restart: unless-stopped
    environment:
      POSTGRES_DB:       avero_erp
      POSTGRES_USER:     ${DB_USER:-avero}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    networks:
      - erp_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-avero} -d avero_erp"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  redis:
    image: redis:7-alpine
    container_name: avero_redis
    restart: unless-stopped
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    networks:
      - erp_net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: ../docker/Dockerfile.backend
    container_name: avero_backend
    restart: unless-stopped
    env_file: .env
    environment:
      NODE_ENV: production
      PORT: "4000"
      DATABASE_URL: postgresql://${DB_USER:-avero}:${DB_PASSWORD}@db:5432/avero_erp
      REDIS_URL: redis://redis:6379
      TELEGRAM_BOT_INTERNAL_URL: http://bot:8080
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - erp_net
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:4000/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    command: >
      sh -c "npx prisma migrate deploy && node dist/main.js"

  frontend:
    build:
      context: ./frontend
      dockerfile: ../docker/Dockerfile.frontend
    container_name: avero_frontend
    restart: unless-stopped
    networks:
      - erp_net

  bot:
    build:
      context: ./telegram-bot
      dockerfile: ../docker/Dockerfile.bot
    container_name: avero_bot
    restart: unless-stopped
    env_file: .env
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://${DB_USER:-avero}:${DB_PASSWORD}@db:5432/avero_erp
      REDIS_URL: redis://redis:6379
      API_BASE_URL: http://backend:4000/api/v1
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - erp_net

  nginx:
    image: nginx:1.25-alpine
    container_name: avero_nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
    depends_on:
      - backend
      - frontend
      - bot
    networks:
      - erp_net
