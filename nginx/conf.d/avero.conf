limit_req_zone $binary_remote_addr zone=api:10m rate=60r/m;
limit_req_zone $binary_remote_addr zone=auth:10m rate=5r/m;

server {
  listen 80;
  server_name _;

  # Health check
  location /health {
    proxy_pass http://backend:4000/health;
    access_log off;
  }

  # API — route to backend
  location /api/ {
    limit_req zone=api burst=20 nodelay;
    proxy_pass         http://backend:4000/api/;
    proxy_http_version 1.1;
    proxy_set_header   Host              $host;
    proxy_set_header   X-Real-IP         $remote_addr;
    proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header   X-Forwarded-Proto $scheme;
    proxy_read_timeout 30s;
    client_max_body_size 50m;
  }

  # Auth stricter rate limit
  location /api/v1/auth/login {
    limit_req zone=auth burst=3 nodelay;
    proxy_pass         http://backend:4000/api/v1/auth/login;
    proxy_set_header   Host      $host;
    proxy_set_header   X-Real-IP $remote_addr;
  }

  # Telegram webhook
  location /webhook/ {
    proxy_pass         http://bot:8080/webhook/;
    proxy_http_version 1.1;
    proxy_set_header   Host      $host;
    proxy_set_header   X-Real-IP $remote_addr;
    proxy_read_timeout 10s;
  }

  # API docs
  location /docs {
    proxy_pass http://backend:4000/docs;
  }

  # React SPA — catch-all
  location / {
    proxy_pass         http://frontend:80;
    proxy_http_version 1.1;
    proxy_set_header   Host $host;
    location ~* \.(js|css|png|jpg|webp|svg|woff2|ico)$ {
      proxy_pass http://frontend:80;
      expires 1y;
      add_header Cache-Control "public, immutable";
    }
  }
}
